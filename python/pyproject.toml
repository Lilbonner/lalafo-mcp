[project]
name = "lalafo-mcp"
version = "0.1.0"
description = "MCP server for searching Lalafo (KG) listings and assisting with Carcheck fine checks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
]

[project.scripts]
lalafo-mcp = "lalafo_mcp.server:main"
lalafo-mcp-monitor = "lalafo_mcp.monitor:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lalafo_mcp"]
